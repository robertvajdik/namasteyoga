styly.sec6.title = Spokojené tělo a duše

styly.restorative.title = Restorativní jóga <span>|</span> pro záda a celé tělo
styly.restorative.tag = Cvičení zlepšuje flexibilitu páteře, zmírňuje bolesti zad a podporuje celkovou fyzickou rovnováhu.
styly.restorative.p1 = Zpomal. Uvolni záda. Dopřej tělu prostor k regeneraci.
styly.restorative.p2 = Restorativní jóga je jemná a klidná praxe zaměřená na uvolnění napětí v oblasti zad, šíje a celého těla. Pomáhá zpomalit, zklidnit dech a dopřát tělu kvalitní odpočinek. V lekci využíváme jógové pomůcky, které poskytují tělu oporu a umožňují pohodlně setrvat v jednotlivých pozicích delší dobu. Bez výkonu, bez spěchu a bez potřeby jít přes své limity.
styly.restorative.p3 = Pozornost věnujeme především páteři, zádům, ramenům a oblasti šíje. Jemným pohybem, vědomým dechem a uvolněním vytváříme prostor pro příjemný pocit lehkosti a odpočinku.
styly.restorative.whom = Pro koho je lekce vhodná?
styly.restorative.whom.p1 = Pro všechny, kteří tráví hodně času vsedě, cítí napětí v zádech nebo šíji, mají jednostranné zatížení nebo jednoduše potřebují svému tělu dopřát více péče a regenerace. Lekce je vhodná pro začátečníky i zkušené praktikující.
styly.restorative.whom.p2 = Nemusíš být flexibilní. Nemusíš nic umět. Stačí přijít a dopřát si čas pro sebe. 🤍 Zastav se. Nadechni se. Uvolni záda. Nech tělo odpočívat.

styly.yinsoul.title = Yin &amp; Soul jóga <span>|</span> jemná praxe
styly.yinsoul.tag = Jemné jógové pohlazení pro tělo. Klid pro mysl. Čas pro duši. Pro všechny věkové kategorie.
styly.yinsoul.p1 = Yin &amp; Soul jóga je pomalá a vědomá praxe, která zve ke zklidnění, hlubšímu uvolnění a návratu k sobě. V jednotlivých pozicích setrváváme delší dobu a s pomocí dechu necháváme tělo postupně povolit. Nesnažíme se nic překonávat ani dosáhnout dokonalého provedení. Naopak – učíme se zpomalit, naslouchat svému tělu a přijímat ho takové, jaké právě je.
styly.yinsoul.p2 = Yinová část lekce přináší prostor pro hlubší protažení a uvolnění napětí v těle. Soul část propojuje praxi s vnitřním prožitkem, vědomým dechem a zklidněním mysli. Je to čas, kdy můžeš na chvíli odložit povinnosti, vypnout hlavu a obrátit pozornost dovnitř. 🌙
styly.yinsoul.whom = Pro koho je Yin &amp; Soul jóga?
styly.yinsoul.whom.p1 = Pro každého, kdo hledá rovnováhu mezi aktivním životem a potřebou zpomalit. Je vhodná pro začátečníky i zkušené praktikující a krásně doplňuje dynamičtější formy jógy i další pohybové aktivity. Nemusíš být flexibilní. Nemusíš nic dokazovat. Stačí přijít, nadechnout se a dovolit si chvíli jen být. Dopřej svému tělu jemnost, své mysli klid a své duši prostor.
styly.yinsoul.whom.p2 = YIN – tento styl jógy zkoumá náš vnitřní prostor a umožňuje nám do hloubky poznat sámi sebe i své tělo. Propojí naše tělo i mysl společně s dechem a jemným pohybem. Jin jóga je propojením tří starodávných tradic a to Indické (filosofie a ásany), Čínské taoistické a z tradiční čínské medicíny (teorie meridiánů a energie Qi). Pomocí hlubokých moudrostí vycházejících z tradic a jejich znalostí propůjčuje yin józe její jemnost, nenásilnost a vnitřní sílu. Především se snažíme o uvolnění napětí nejen ve svalech, ale také v kloubních spojeních a především spodní části těla (jinová část těla). Pohyb je prováděn šetrně k našim možnostem a vědomým pohybem. Je to jóga vhodná pro všechny z nás, bez ohledu na naše zkušenosti či věk. Vnáší nám do života jinový princip. Dodává našemu tělu i mysli klidnější přístup a vnímání sama sebe. Touto jógou pohladíme nejen naše tělo, ale i duši.

styly.zaklady.title = Základy jógy a dechu
styly.zaklady.tag = Začni od základů. Nauč se vnímat své tělo, dech i pohyb.
styly.zaklady.p1 = 🌿 Tato lekce je jemným a srozumitelným úvodem do světa jógy. Je určena všem, kteří s jógou začínají, chtějí si upevnit základy nebo si přejí lépe porozumět tomu, co se při jógové praxi skutečně děje.
styly.zaklady.p2 = Společně se naučíme základní jógové pozice, principy správného provedení, práci s tělem a vědomým dechem. Zaměříme se na stabilitu, mobilitu, držení těla a bezpečné nastavení jednotlivých pozic. Velkou pozornost věnujeme právě dechu. Ukážeme si, jak dech propojit s pohybem, jak ho vnímat a jak jej využít pro lepší soustředění, uvolnění a zklidnění. Lekce probíhá v klidném tempu a nabízí dostatek prostoru jednotlivé pozice pochopit, vyzkoušet a najít v nich vlastní pohodlí.
styly.zaklady.learn = Co si z lekce odneseš?
styly.zaklady.b1 = ✨ lepší orientaci v základních jógových pozicích
styly.zaklady.b2 = ✨ vědomější práci s dechem
styly.zaklady.b3 = ✨ lepší vnímání vlastního těla
styly.zaklady.b4 = ✨ základy správného a bezpečného provedení pozic
styly.zaklady.b5 = ✨ větší stabilitu, mobilitu a koordinaci
styly.zaklady.b6 = ✨ nástroje, které můžeš využít i při domácí praxi
styly.zaklady.p3 = Nemusíš být flexibilní. Nemusíš nic umět. Nemusíš mít s jógou žádnou předchozí zkušenost. Stačí přijít s otevřenou myslí a chutí poznat své tělo trochu jinak.
styly.zaklady.p4 = 🌱 Protože když rozumíš základům, můžeš na nich postavit celou svou jógovou cestu.
styly.zaklady.p5 = Zastav se. Nadechni se. Začni od začátku.

styly.power.title = Power jóga <span>|</span> funkční zdravý pohyb
styly.power.tag = Síla, energie a vědomý pohyb v jednom.
styly.power.p1 = Power joga je dynamická forma jógy, která propojuje jógové pozice, plynulý pohyb, posilování a práci s dechem. Během lekce se příjemně zapotíš, posílíš celé tělo a zároveň si dopřeješ prostor zpomalit, soustředit se na sebe a na chvíli vypnout od každodenního shonu.
styly.power.p2 = Lekce je zaměřená především na sílu, stabilitu, flexibilitu a aktivní střed těla. Čeká tě svižnější tempo, plynulé přechody mezi pozicemi a cviky, které zapojí celé tělo. Na závěr samozřejmě nechybí zklidnění a relaxace.
styly.power.whom = Pro koho je Power joga?
styly.power.whom.p1 = Pro každého, kdo má rád aktivní pohyb a chce své tělo nejen protáhnout, ale také posílit. Nemusíš být zkušený – důležité je přijít s chutí vyzkoušet něco nového a respektovat možnosti svého těla.

styly.core.title = Core <span>|</span> cvičení a jóga pro pevný střed těla
styly.core.tag = Core neboli hluboký stabilizační systém.
styly.core.p1 = Core se na lekcích učíme správně zapojit a hlavně vysvětlit, co ten core vlastně je, a co všechno sebou nese jeho zpevnění. Jde o hlubokou vrstvu svalů, kterou pečlivě a postupně zapojujeme po jednotlivých částech a poté spojíme v jeden celek. Chceme, aby jste se naučili své svaly (core) a tělo dokonale zvládnout a mít nad ním plnou kontrolu při jakémkoliv cvičení. Využíváme ty nejvhodnější a vybrané cviky nejen z jógy pro správné posílení. Lekce jsou určeny všem, kteří mohou mít různé bolesti zad, skoliózy a další deformace páteře, slabé břišní svalstvo, diastázu neboli rozestup břišních svalů, a mnoho dalších. Zpevnění sebou nese velká pozitiva, úlevu od bolestí nejen v zádech, vyrovnané tělo, větší oporu pro orgány, správné zapojení bránice a mnoho dalších.

styly.pilatesSoft.title = Sculpt Pilates Mat <span>|</span> soft &amp; gentle
styly.pilatesSoft.tag = Jemná cesta k silnějšímu a stabilnějšímu tělu.
styly.pilatesSoft.p1 = Mat Pilates Soft &amp; Gentle je klidnější forma Pilates zaměřená na vědomý pohyb, správné držení těla, aktivaci hlubokého stabilizačního systému a jemné posílení celého těla.
styly.pilatesSoft.p2 = Lekce probíhá v příjemném tempu a je ideální pro ty, kteří chtějí začít s Pilates, vrátit se k pravidelnému pohybu nebo si jednoduše dopřát šetrné, ale účinné cvičení. Budeme pracovat především s dechem, středem těla, stabilitou páteře a kontrolovaným pohybem. Důraz klademe na kvalitu provedení, vnímání vlastního těla a správné zapojení svalů, nikoli na výkon. Čeká tě jemné posílení, mobilizace, protažení a příjemné uvolnění. Pro chvíle, kdy chceš své tělo posílit, ale zároveň mu dopřát laskavost a respekt.
styly.pilatesSoft.p3 = Vhodné pro začátečníky i pro každého, kdo hledá jemnější formu Pilates.

styly.pilatesFull.title = Sculpt Pilates Mat <span>|</span> full body sculpt
styly.pilatesFull.tag = Posiluj. Tvaruj. Vnímej každý pohyb.
styly.pilatesFull.p1 = Full Body Sculpt je dynamičtější lekce Mat Pilates zaměřená na efektivní posílení a zpevnění celého těla. Čeká tě kombinace Pilates principů, vědomé práce se středem těla a cílených posilovacích sekvencí, které postupně zapojí břicho, hýždě, stehna, paže i záda.
styly.pilatesFull.p2 = Lekce staví na kontrolovaném a přesném pohybu, aktivním středu těla a správném zapojení svalů. Díky plynulému tempu a opakování jednotlivých pohybových vzorců dostane tělo příjemnou posilovací výzvu bez potřeby těžkých vah.
styly.pilatesFull.p3 = Full Body Sculpt je ideální pro všechny, kteří chtějí pracovat na síle, stabilitě, svalovém tonusu a celkovém zpevnění postavy.
styly.pilatesFull.p4 = 🔥 Čeká tě aktivní lekce, po které budeš cítit, že tvé tělo opravdu pracovalo.
styly.pilatesFull.p5 = Vhodné pro začátečníky i pokročilejší – intenzitu jednotlivých cviků lze přizpůsobit vlastním možnostem.

styly.vinyasa.title = Vinyasa jóga
styly.vinyasa.tag = Intenzivní silová lekce na posílení celého těla pro pokročilejší.
styly.vinyasa.p1 = Dokonale rozvíjí flexibilitu, sílu a vzhled celého těla, velmi dobře upravuje krevní oběh, kardiovaskulární systém a urychluje metabolismus. Pomocí dechových cvičení spojených s prováděním pozic velmi intenzivně pročišťujeme a detoxikujeme celé tělo. Tento styl jógy je vhodný pro pokročilejší, kteří jsou seznámeni s prováděním jógových pozic, ale i pro ostatní, kteří se ji nebojí vyzkoušet. Lekce je sestavena z pozdravu slunce, návaznosti pozic na pozdrav slunce, nácviku jednoduchých i obtížnějších ásan (ve stoji, sedu) s využitím dechu udžají, který je součástí této jógy. Na konci cvičení se uchýlíme k relaxaci, kde uvolníme celé tělo, svalové napětí a ponoříme se do vnitřního světa sebe samotných, kde se staneme pravým a skutečným „Já", tedy sami sebou. Celkové cvičení nás zbaví napětí ve svalech, únavy, stresu, příjemně nás naladí a přivede k harmonii tělesné i duševní.

styly.panevni.title = Pánevní dno <span>|</span> péče a ženskost
styly.panevni.tag = Vědomá péče o ženské tělo. Síla, stabilita a hlubší spojení se sebou.
styly.panevni.p1 = Pánevní dno je důležitou součástí našeho hlubokého stabilizačního systému. Přesto mu často věnujeme jen malou pozornost.
styly.panevni.p2 = Tato lekce je pozváním zpomalit, lépe vnímat své tělo a naučit se vědomě zapojovat svaly pánevního dna v souhře s dechem a hlubokým středem těla. Budeme pracovat s jemnými a zároveň účinnými pohyby, které podporují správné zapojení hlubokých svalových vrstev, stabilitu pánve a aktivní střed těla. Zaměříme se na schopnost pánevní dno nejen aktivovat, ale také vědomě uvolnit – obojí je pro jeho správné fungování důležité.
styly.panevni.p3 = Pozornost budeme věnovat také propojení pánevního dna s bránicí, hlubokými břišními svaly a svaly kolem páteře. Právě jejich vzájemná spolupráce vytváří přirozenou oporu pro naše tělo a pomáhá nám vnímat pohyb jistěji a vědoměji.
styly.panevni.p4 = Lekce je vedena citlivě a s respektem k individuálním možnostem každého těla. Nejde o maximální výkon ani o „zatínání" svalů za každou cenu. Učíme se rozpoznat správný pocit, pracovat s dechem a postupně budovat sílu, stabilitu i důvěru ve vlastní tělo.
styly.panevni.whom = Pro koho je lekce vhodná?
styly.panevni.whom.p1 = Pro ženy, které chtějí lépe poznat své tělo, posílit hluboký střed, věnovat pozornost pánevnímu dnu a osvojit si jeho vědomé zapojení v každodenním pohybu. Lekce může být krásným doplněním péče o ženské tělo v různých životních obdobích. Každá žena pracuje podle svých možností a aktuálních potřeb.
styly.panevni.whom.p2 = 🌿 Dýchej. Vnímej. Aktivuj. Uvolni. Posiluj zevnitř. Dopřej svému tělu pozornost, kterou si zaslouží.
styly.panevni.proc = Proč se věnovat pánevnímu dnu?
styly.panevni.proc.p = Správně fungující pánevní dno není jen o síle. Stejně důležitá je jeho schopnost vědomě se aktivovat, pracovat v souhře s dechem a hlubokým středem těla a následně se také uvolnit. Vědomá práce s pánevním dnem může pomoci při obtížích, jako jsou:
styly.panevni.b1 = 🌿 únik moči při kašli, smíchu, běhu nebo cvičení,
styly.panevni.b2 = 🌿 pocit oslabení nebo nedostatečné opory v oblasti pánve,
styly.panevni.b3 = 🌿 snížené vnímání pánevního dna a obtížné vědomé zapojení jeho svalů,
styly.panevni.b4 = 🌿 některé obtíže spojené s obdobím po porodu,
styly.panevni.b5 = 🌿 nejistota při návratu k pohybu a sportu po těhotenství,
styly.panevni.b6 = 🌿 pocit nestability v oblasti pánve a středu těla,
styly.panevni.b7 = 🌿 snížená koordinace dechu, pánevního dna a hlubokých břišních svalů.
styly.panevni.p5 = U některých žen však není problémem pánevní dno slabé, ale naopak příliš napjaté. Proto se v lekci neučíme pouze „zatínat", ale také vnímat napětí a pánevní dno vědomě uvolnit. Správná funkce vyžaduje rovnováhu mezi aktivací a relaxací. Pravidelná a správně prováděná aktivace může podpořit lepší kontrolu močového měchýře, stabilitu středu těla a celkové vnímání oblasti pánve. Pokud jsou obtíže výrazné, přetrvávají nebo jsou spojeny s bolestí, je vhodné jejich řešení konzultovat s odborníkem na fyzioterapii pánevního dna. Nejde o to mít pánevní dno neustále stažené. Jde o to umět ho vnímat, správně zapojit, koordinovat s dechem a ve správný okamžik také uvolnit. 🤍

styly.tehotne.title = Jóga pro těhotné
styly.tehotne.tag = Čas pro tebe, tvé tělo a malé miminko.
styly.tehotne.p1 = 🤍 Těhotenství je jedinečné období plné proměn. Jóga pro těhotné nabízí bezpečný a vědomý prostor, kde můžeš naslouchat svému tělu, zůstat v příjemném pohybu a připravovat se na jednotlivé etapy těhotenství i samotný porod.
styly.tehotne.p2 = Lekce propojuje jemný pohyb, vědomý dech, uvolnění a posílení těla. Zaměřujeme se na mobilitu páteře a pánve, uvolnění zad a oblasti šíje, zdravé držení těla a přirozenou práci s těžištěm, které se během těhotenství mění. Pozornost věnujeme také pánevnímu dnu – učíme se ho nejen vědomě aktivovat, ale především vnímat a uvolňovat.
styly.tehotne.p3 = Práce s dechem pomáhá rozvíjet schopnost zůstat v klidu, vnímat své tělo a vědomě reagovat na jeho potřeby. Součástí lekce jsou také relaxační techniky a chvíle zastavení, kdy můžeš obrátit pozornost k sobě a svému miminku.
styly.tehotne.p4 = 🌿 Jóga jako příprava na porod. Jemná práce s dechem, pánevní oblastí, pohyblivostí a schopností uvolnit napětí může být krásnou součástí přípravy na porod. Učíme se vnímat signály vlastního těla, pracovat s dechem a hledat polohy, ve kterých se cítíme bezpečně a komfortně.
styly.tehotne.whom = Pro koho je lekce vhodná?
styly.tehotne.whom.p1 = Pro nastávající maminky, které chtějí zůstat aktivní, pečovat o své tělo a vytvořit si chvíli klidu během každodenního života. Lekce respektuje individuální potřeby těhotných žen a jednotlivé fáze těhotenství. Nejde o výkon ani o dokonalé provedení pozic. Důležité je pohodlí, bezpečí a dobrý pocit z pohybu.
styly.tehotne.whom.p2 = 🤍 Zpomal. Nadechni se. Vnímej své tělo. Buď v kontaktu se svým miminkem. Dopřej si čas, který patří jen vám dvěma.
styly.tehotne.note = Před zahájením cvičení v těhotenství doporučujeme konzultaci s ošetřujícím lékařem nebo porodní asistentkou. Při zdravotních komplikacích je vždy nutné řídit se jejich doporučením.

styly.diastaza.title = Diastáza <span>|</span> viz. cvičení Core
styly.diastaza.tag = Obnovení funkce břišních svalů a fyzio přístup k řešení rozestupu břišních svalů.

styly.hormonalni.title = Hormonální jóga <span>|</span> dle Dinah Rodrigues
styly.hormonalni.tag = Jóga pro harmonizaci hladiny hormonů dle Dinah Rodrigues.
styly.hormonalni.p1 = Je ucelená sestava vyvinutá speciálně pro ženy orientovaná na obnovu hormonální rovnováhy. Pravidelným cvičením lze odstranit problémy jako je bolestivá, silná nebo chybějící menstruace, některé příčiny neplodnosti, premenstruační syndrom apod. Především však byla tato sestava vyvinutá pro ženy ve středním věku, jako metoda předcházení a řešení problémů menopauzy: návaly, psychické problémy, osteoporóza apod. Na společném cvičení budeme pracovat s tělem, dechem a vedením energie, povzbudíme a posílíme náš podbřišek a probereme typicky ženské problémy ze zdravotního a duševního pohledu. Sestava je určena ženám bez rozdílu věku. Předchozí zkušenosti s jógou nejsou důležité.

styly.intuitivni.title = Intuitivní jóga <span>|</span> pouze pro ženy
styly.intuitivni.tag = Inspirativní a procítěné lekce pro ženy.
styly.intuitivni.p1 = Jde o ženskou skupinu, kde naleznete uvolnění, porozumění a podporu v úzkém kruhu žen. Naučíme se kultivovat ženskou energii a objevovat vlastní sílu. Lépe tak pochopíme potřeby svého těla a zaměříme pozornost na sama sebe. Na lekcích budeme používat jednoduché techniky, které nám pomohou načerpat ztracenou energii a chuť znovu tvořit. Uvolníme tělo i mysl.
styly.intuitivni.obsah = Obsah kurzu
styly.intuitivni.b1 = Jóga jemná, protahovací a uvolňující
styly.intuitivni.b2 = Dynamické meditace pro rozproudění životní energie
styly.intuitivni.b3 = Léčebné meditace se zaměřením na čištění čaker, léčení vztahů ad.
styly.intuitivni.b4 = Zklidňující meditace na závěr
styly.intuitivni.b5 = Spontánní tanec a rozproudění sexuality
styly.intuitivni.b6 = Arteterapie a uvolnění pocitů pomocí malování
styly.intuitivni.b7 = Rituály s přáním
styly.intuitivni.b8 = Tantra jóga pro ženy / Mohendžodáro
styly.intuitivni.b9 = Ukázky uvolňující masáže dlaní a chodidel
styly.intuitivni.p2 = Každá lekce Vás překvapí něčím novým. Obsah lekcí není pevně dán.

styly.fly.title = Fly jóga <span>|</span> jóga a cvičení v sítích
styly.fly.tag = Leť, uvolni se a objev úplně nový způsob pohybu.
styly.fly.p1 = ✨ Fly jóga je jedinečné spojení jógy, pohybu a závěsné sítě, která se stává oporou i výzvou zároveň. Umožní ti dostat se do pozic, které jsou na podložce náročnější, bezpečněji pracovat s vlastním tělem a zažít nádherný pocit lehkosti a volnosti.
styly.fly.p2 = Během lekce střídáme posilování, protažení, stabilizační cviky, relaxaci a prvky ve vzduchu. Závěsná síť pomáhá při hlubším protažení, odlehčení páteře i při posilování středu těla. Fly jóga podporuje sílu, flexibilitu, rovnováhu, koordinaci a vnímání vlastního těla. Zároveň je skvělým způsobem, jak na chvíli vystoupit z každodenní rutiny a dopřát si pohyb trochu jinak. A pak přijde chvíle, kdy se necháš v síti jen tak pohoupat… 🌿 Tělo odpočívá, dech se zklidní a hlava konečně na chvíli vypne.
styly.fly.whom = Pro koho je Fly jóga?
styly.fly.whom.p1 = Pro každého, kdo chce vyzkoušet něco nového, má rád pohyb a chce si užít kombinaci síly, protažení, hravosti a relaxace. Nemusíš umět jógu ani mít předchozí zkušenosti se závěsným cvičením. Všechny pozice a jejich náročnost přizpůsobujeme individuálním možnostem.
styly.fly.whom.p2 = ✨ Posiluj. Protáhni se. Uvolni se. A dovol si létat. Přijď objevit pocit, kdy se tvoje tělo na chvíli vznese nad zemí. 🤍

styly.wall.title = Wall jóga <span>|</span> jóga s popruhy na zdi
styly.wall.tag = Jóga se speciálními popruhy na zdi.
styly.wall.p1 = Jóga ve speciálních závěsných popruzích. Popruhy nám slouží především k snadnějšímu provedení pozice, delší výdrži a nebo naopak její zintenzivnění. Popruh pracuje jako opora tělu nebo jako pomůcka k jeho posílení (princip TRX). Popruhy slouží k snazšímu uvolnění ztuhlé páteře a dalších kloubních spojení, k mnohonásobně lepšímu protažení díky delším výdržím. Pomocí popruhů a silovějších pozic posílíme hluboký stabilizační systém, kde celé tělo zpevňujeme od základu. Všechny pozice děláme pečlivě a bezpečně. Naučíme se vnímat svět i z jiného úhlu pohledu. Nebudou chybět ani obrácené pozice, do kterých se dostaneme pomocí popruhů s lehkostí, kde konečně můžete pocítit velmi blahodárné a léčivé účinky obrácených pozic. Součástí lekcí jsou dechové i relaxační techniky. Lekce má osvěžující účinky na tělo, mysl i duši, které se stanou jedno. Lekce je zaměřena na posílení a uvolnění celého těla.
styly.wall.flow = <strong>FLOW &amp; WALL</strong> – protahující lekce, která plyne v příjemném tempu. Lekce má blahodárný vliv na krevní oběh, hladinu hormonů, práci srdce, plic a dalších orgánů. Uvolníme blokády a zprůchodníme tok energie. Více viz. flow jóga.
styly.wall.yin = <strong>YIN &amp; WALL</strong> je velmi jemná, uvolňující a meditativní lekce. Popruhy nám pomohou dlouho setrvat v pozici a vychutnat si její fyzický i duševní přínos. Tento styl jógy zkoumá do hloubky náš vnitřní prostor. Umožňuje nám poznat sám sebe. Dodává nám klidnější přístup a jinový princip do života. Více viz. tibetan yin jóga.

styly.blacklight.title = Blacklight <span>|</span> jóga &amp; pilates v UV světle
styly.blacklight.tag = Když se z lekce stane zážitek.
styly.blacklight.p1 = ✨🖤 Přicházíš do studia. Zhasne se. Rozsvítí se UV světla. A najednou je všechno jinak. Blacklight jóga &amp; Pilates je zážitková lekce, která propojuje vědomý pohyb, hudbu a jedinečnou atmosféru fialového světla. Pod UV světlem ožijí barvy, pomůcky i oblečení a běžná lekce dostává úplně nový rozměr. Čeká tě kombinace jógy, Pilates, posílení středu těla, protažení a dynamického pohybu – tentokrát ale v prostředí, které tě vtáhne do děje.
styly.blacklight.p2 = 🖤 Žádná nuda.
styly.blacklight.p3 = ✨ Žádná rutina.
styly.blacklight.p4 = 🔥 Jen pohyb, hudba, energie a zážitek.
styly.blacklight.p5 = Blacklight lekce je skvělá pro všechny, kteří chtějí vyzkoušet něco nového, užít si pohyb trochu jinak a na chvíli zapomenout na běžný svět. Ať už přijdeš s kamarádkou, partnerem, nebo sama, čeká tě večer, který nebude jen o cvičení. Budeš se hýbat. Budeš se smát. Možná se i pořádně zapotíš. A hlavně – budeš chtít znovu.
styly.blacklight.p6 = 🌌 Ponoř se do tmy. Rozsviť své tělo. Zažij jógu a Pilates úplně jinak.
styly.blacklight.p7 = Nejzářivější lekce, jakou jsi ještě nezažila. ✨

styly.parova.title = Párová jóga <span>|</span> jóga ve dvou
styly.parova.tag = Jóga ve dvojicích.
styly.parova.p1 = Akrobatická i neakrobatická jóga ve dvojicích či v páru. Důležité je mít parťáka či kamaráda, na kterého se můžete spolehnout na zemi i ve vzduchu. Jde o propojení jógových pozic ve dvojici, kde jóga dostává zcela jiný rozměr. Najednou zjistíme, že už to není jen o nás samotných, ale jsme to my a učíme se důvěřovat jeden druhému. Né vždy to na poprvé bez pomoci vyjde, ale postupně se naučíme správnou techniku, úchopy, dobré držení těla nahoře i dole, pozice i přechody mezi nimi. Užijeme si vzájemné propojení rovnováhy mezi sebou. Přijď si vyzkoušet úžasnou jógu ve dvou, ve třech i více lidech. Naučíme tě věřit 😉

styly.cakra.title = Čakra jóga <span>|</span> harmonizace energie
styly.cakra.tag = Jóga harmonizující tok energie v našem těle a čakrách.
styly.cakra.p1 = Čakra jóga je zaměřená na ásany a jejich působení na jednotlivé čakry. V našem těle se nachází 7 hlavních čaker, které jsou navzájem propojené a každá si vyžaduje svou specifickou pozici i přístup. Čakry jsou energetické víry, které lze harmonizovat pomocí jógy, relaxací i meditací. Na každé lekci se seznámíme s jednou čakrou a naučíme se pozice, které čakru nejvíce ovlivňují a harmonizují. Vysvětlíme si, co jsou čakry, kde se nachází, jakou mají barvu, účinky, jaké způsobují emoce, jak je můžeme ovlivnit a léčit pomocí jógových ásan a relaxací. Podrobně proberem jednotlivé pozice a jejich působení na jednotlivé čakry. Chakra yoga nás naučí jak harmonizovat sami sebe. Předchozí zkušenosti s jógou nejsou důležité.

styly.deti.title = Jóga a cvičení pro děti
styly.deti.tag = Zábavná a naučná lekce jógy na zemi i ve vzdušných sítích.
styly.deti.p1 = Jóga, která děti baví, rozvíjí a nechává je objevovat svět pohybu.
styly.deti.p2 = 🌈 Dětská jóga je především hravá, veselá a plná fantazie. Děti se prostřednictvím pohybu učí vnímat své tělo, pracovat s dechem, soustředit se a postupně objevovat, co všechno jejich tělo dokáže. V našich lekcích využíváme spoustu různých pomůcek – létající sítě, nástěnné popruhy, míčky, kruhy, bloky, balanční pomůcky a další vybavení. Díky nim se děti mohou dostat do různých pohybových situací, zkoušet nové pozice, balancovat, posilovat i protahovat se. Pomůcky dětem přirozeně pomáhají rozvíjet rovnováhu, koordinaci, stabilitu, sílu, flexibilitu a prostorové vnímání. Zároveň podporují jejich přirozenou zvídavost a chuť zkoušet nové věci.
styly.deti.p3 = Nejde ale jen o samotné cvičení. Dětská jóga vytváří prostor, kde se děti učí naslouchat svému tělu, pracovat s dechem, zklidnit se a respektovat sebe i ostatní. Každá lekce může být malým dobrodružstvím – jednou se vydáme do džungle, jindy létáme v síti, hledáme rovnováhu nebo objevujeme nové jógové pozice.
styly.deti.proc = 🐒🌿🦋 Proč dětská jóga?
styly.deti.b1 = ✨ podporuje zdravý pohybový vývoj
styly.deti.b2 = ✨ rozvíjí koordinaci a rovnováhu
styly.deti.b3 = ✨ posiluje tělo a hluboký stabilizační systém
styly.deti.b4 = ✨ podporuje flexibilitu a správné držení těla
styly.deti.b5 = ✨ učí děti vnímat své tělo a dech
styly.deti.b6 = ✨ rozvíjí soustředění a schopnost zklidnění
styly.deti.b7 = ✨ podporuje sebevědomí, samostatnost a radost z pohybu
styly.deti.p4 = U nás děti necvičí proto, aby byly nejlepší. Cvičí proto, aby objevily radost z pohybu, poznaly své tělo a užily si společný čas. 🤍 🌈 Pohyb, fantazie, smích a jóga – přesně tak, jak to děti mají rády.

styly.autogenni.title = Relaxace a autogenní trénink
styly.autogenni.tag = Relaxační technika dle Johannes Heinricha Schultze.
styly.autogenni.p1 = Jde o relaxační a psychoterapeutickou metodu, která pomocí sugesce postupně uvolňuje fyzické i psychické napětí a umožňuje lépe ovládat i některé vegetativní funkce. Vyšší stupeň může přecházet od relaxace až k meditaci.
styly.autogenni.p2 = Autogenní trénink využíváme také u lidí, kteří trpí jistými problémy, jako jsou: neurózy, závislosti, psychosomatické poruchy a mnoho dalších.
styly.autogenni.p3 = Jde o techniku, která je v dnešním světě velmi přínosná a pro náš organismus velmi prospěšná. Zvládneme ji kdekoliv a nestojí nás nic, než kvalitně strávený čas se sebou.

styly.meditace.title = Meditace
styly.meditace.tag = Pro duševní, mentální i fyzické uvolnění.
styly.meditace.p1 = Jsou určeny všem, kteří se chtějí věnovat vlastnímu rozvoji, také pro lidi oslabené, vyčerpané a hledající. Při tak hluboké relaxaci, jako je meditace osvěžíme celý organismus, znovu rozproudíme energetická centra, načerpáme duševní i psychickou sílu. Při meditaci můžeme zažít hluboké poznání sebe sama, můžeme hledat i nacházet cesty, můžeme se naučit pozitivnímu přístupu k sobě i druhým ad. Je jen na nás, zda budeme zdraví, šťastní, úspěšní a spokojeni. Jsme tvůrci svého života.

styly.mindfulness.title = Mindfulness
styly.mindfulness.tag = Cesta k duševní pohodě.
styly.mindfulness.p1 = Mindfulness (všímavost) nám pomáhá najít klid v uspěchaném světě. Jedná se o významný koncept západní psychologie a psychoterapie, který vychází z buddhismu. Výzkumy opakovaně prokázaly pozitivní vliv mindfulness: Rozvíjení všímavosti pomáhá redukovat pocity úzkosti, deprese, nadměrnou únavu či nespavost a má pozitivní vliv na zvládání stresu a na psychické i fyzické zdraví. Meditace a relaxace pro zklidnění organismu. V osmihodinovém kurzu se naučíme několik způsobů, jak všímavost začlenit do svého života. V malé skupince budeme mít možnost sdílet s ostatními naše zkušenosti.

styly.taichi.title = Tai či
styly.taichi.tag = Tchaj-ťi čchüan – umění pěstování čchi.
styly.taichi.quote1 = „Pomalu se pohybuješ pod korunami stromů, dýcháš, připadá ti, že spolu s lehounkým vánkem splýváš s přírodou v jejím léčivém rytmu. Všechny části těla se pohybují společně, plynule, hladce a uvolněně. Je těžké Tai či popsat slovy. Je to, jako byste chtěli pomocí slov vyjádřit hudbu."
styly.taichi.quote1.cite = — Paul Crompton, kniha Tai či
styly.taichi.p1 = Tai či (správně tchaj-ťi čchüan) je popisováno jako umění pěstování čchi. Staří Číňané stejně jako naši předkové věřili, že život je jako zapálená svíce a každý si ji má chránit, aby hořela co nejdéle a její plamínek byl stálý. Velikost plamene odpovídá množství čchi, kterou si umíme uchovávat. Sestava Tai či je pomalou, plynulou a ladnou choreografií 108 na sebe navazujících pozic, kdy čchi volně proudí tělem po drahách, kterým staří Číňané říkají meridiány. I když je Tai či bojovým uměním, jeho provedení osloví ty, co hledají klid a harmonii.
styly.taichi.quote2 = Tělo nechť každodenní své hýbání má.
styly.taichi.quote2.cite = — Jan Amos Komenský
