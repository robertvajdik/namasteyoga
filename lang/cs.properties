index.about.eyebrow = O nás
index.about.h = Studio Namasté.
index.about.p1 = Některé věci přicházejí přesně ve chvíli, kdy mají. A Studio Namasté vzniklo právě tak – z dlouholetých zkušeností, hledání a touhy vytvořit místo, kde můžeme zpomalit, nadechnout se a vrátit se sami k sobě.
index.about.p2 = Studio Namasté je prostorem pohybu, harmonie, klidu a setkávání. Místem, kde se propojuje tělo s dechem, pohyb s vnímáním a vnější svět s tím, co se odehrává uvnitř nás. Jóga je pro každého. Nemusíte nic umět ani dokazovat. Stačí přijít takoví, jací právě jste. Věříme, že si ze studia můžete odnést více lehkosti, síly, klidu, radosti – nebo jen nový nádech.
index.quote.text = „Uctívám to místo v Tobě, kde přebývá celý vesmír, místo světla, lásky, pravdy, míru a moudrosti. Skláním se před tím místem, kde jsme oba jeden.“
