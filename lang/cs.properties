puppy.about.eyebrow = O co jde?
puppy.about.title = Cvičení, které pohladí tělo i duši
puppy.about.p1 = Puppy &amp; štěněcí vibe jsou lekce jógy a pilates, které kombinují klidný pohyb, dech a nekonečnou dávku roztomilé přítomnosti čtyřnohých parťáků. Cvičíte v příjemné atmosféře studia, mezi sériemi se protahujete se štěňátky, koťátky nebo vlastními mazlíčky a odcházíte s úsměvem od ucha k uchu.
puppy.about.p2 = Není potřeba žádná předchozí zkušenost – lekce vedeme pro začátečníky i pokročilé a přizpůsobujeme je náladě skupiny i zvířat. Chováme se k nim ohleduplně: pauzy, pití a mazlení jsou přirozenou součástí každé lekce.
puppy.features.eyebrow = Proč si lekce zamilujete?
puppy.features.title = Radost, kterou cítíte hned od první minuty
puppy.feature.1.title = Uvolnění stresu
puppy.feature.1.desc = Mazlení a přítomnost zvířat prokazatelně snižují hladinu kortizolu. Odejdete lehčí a v lepší náladě.
puppy.feature.2.title = Pohyb bez tlaku
puppy.feature.2.desc = Zapomenete na výkon – lekce jsou vedeny s citem, s prostorem pro smích i pauzy na hlazení.
puppy.feature.3.title = Setkání s podobně naladěnými lidmi
puppy.feature.3.desc = Sejde se parta lidí, kteří mají rádi zvířata i chvíli pro sebe. Přátelství se rodí sama.
puppy.feature.4.title = Zážitek, ne jen lekce
puppy.feature.4.desc = Odnesete si fotky, vzpomínky a pocit, že jste udělali něco jen pro sebe – tělo i duši.
puppy.classes.eyebrow = Jaké zvířecí lekce u nás najdete?
puppy.classes.title = Vyberte si svoji dávku štěstí
puppy.class.1.title = Štěněcí lekce
puppy.class.1.sub = Jóga a pilates se štěňátky
puppy.class.1.desc = Klasika mezi zvířecími lekcemi. Cvičíme společně se štěňátky ověřeného chovatele, která si mezi ásanami vyžadují mazlení, pobíhají po sále a vytváří tu nejroztomilejší kulisu, jakou znáte.
puppy.class.1.li.1 = Vhodné pro začátečníky i pokročilé
puppy.class.1.li.2 = Skupinky do 10 osob
puppy.class.1.li.3 = Cvičení 60 – 75 minut
puppy.class.2.title = Lekce s vlastními mazlíčky
puppy.class.2.sub = Přiveďte svého psího parťáka
puppy.class.2.desc = Máte doma pejska, se kterým rádi trávíte čas? Přijďte si s ním zacvičit do studia. Ukážeme vám sestavu, do které svého mazlíčka zapojíte, a společně si užijete klidný a propojující pohyb.
puppy.class.2.li.1 = Pes musí být zvyklý na cizí lidi a zvířata
puppy.class.2.li.2 = Skupinky do 8 párů člověk + pes
puppy.class.2.li.3 = Předchozí konzultace u přihlášení
puppy.class.3.title = Lekce s koťátky
puppy.class.3.sub = Něžnější varianta se šelmičkami
puppy.class.3.desc = Pro milovníky kočiček nabízíme lekce v klidnějším tempu s malými koťátky. Sál se promění v hravé útočiště – ideální pro yin a jemný pilates, kdy si k vám mrňousek přijde přitulit.
puppy.class.3.li.1 = Klidné cvičení jóga / yin / pilates
puppy.class.3.li.2 = Skupinky do 8 osob
puppy.class.3.li.3 = Cvičení 60 minut
puppy.info.eyebrow = Informace k lekcím
puppy.info.title = Pro chovatele
puppy.info.p1 = Rádi navážeme spolupráci s chovateli štěňat i koťat z Uherského Brodu a širokého okolí. Zvířátkům věnujeme naprostou pozornost – sál je klidný, čistý a mezi lekcemi jim zajistíme prostor pro odpočinek, pití i mazlení.
puppy.info.p2 = Pokud jste chovatel a chtěli byste své štěňátka nebo koťátka poslat na lekci, ozvěte se nám přes formulář výše nebo přímo e-mailem – domluvíme podmínky a termíny na míru.
puppy.info.cta.write = Napsat nám
puppy.info.cta.contact = Kontakty studia

