# ---- Styly jógy ----
styly.title = Styly jógy – Namasté Yoga Studio Uherský Brod
styly.meta.description = Pestrá nabídka jógových a pilates stylů – restorativní, yin, power, vinyasa, pánevní dno, prenatální, dětská jóga, fly jóga, wall jóga, blacklight a další.
styly.hero.eyebrow = Styly jógy
styly.hero.title = Najděte svůj styl
styly.hero.lead = Není to jeden styl <span class="styly-bar">|</span> ale vyberte si, co právě potřebujete
styly.intro.title = Jaké styly u nás najdete?
styly.intro.p1 = V Namasté Yoga Studiu věříme, že jóga, pilates a cvičení jako takové může mít mnoho podob. Někdy potřebuješ posílit a rozhýbat tělo, jindy zpomalit, uvolnit napětí a dopřát si hluboký odpočinek. A někdy chceš jednoduše vyzkoušet něco nového a užít si to úplně jinak. Proto u nás najdeš pestrou nabídku lekcí – od dynamických a posilujících stylů až po jemné, relaxační a vědomé praxe.
styly.intro.p2 = Ať už hledáš sílu, uvolnění, regeneraci nebo nový zážitek…
styly.intro.p3 = U nás si můžeš vybrat přesně podle toho, co právě potřebuje tvoje tělo i mysl. Někdy je potřeba zabrat. Někdy zpomalit. A někdy prostě jen… být. Najdi si to své v Namasté yoga Studiu v Uherském Brodě.
styly.namaste = Namasté 🙏
styly.toggle.more = Zobrazit více
styly.toggle.less = Zobrazit méně
styly.cta.title = Vyberte si lekci a přijďte si ji vyzkoušet
styly.cta.lead = Rozvrh otevřených lekcí a kurzů najdete na stránce s rozvrhem. Rezervace je rychlá a jednoduchá.
styly.cta.button = Rezervovat lekci

styly.sec1.eyebrow = Jemnost <span class="styly-bar">|</span> Protažení <span class="styly-bar">|</span> Uvolnění
styly.sec1.title = Zdravotní a bezpečný pohyb
styly.sec1.lead = Lekce, ve kterých pečujeme o své tělo s respektem, vědomě a bez zbytečného výkonu. Pro začátečníky i pokročilé.
styly.sec2.eyebrow = Síla <span class="styly-bar">|</span> Energie <span class="styly-bar">|</span> Pevný střed těla
styly.sec2.title = Posílení a dobrá kondice
styly.sec2.lead = Lekce pro posílení celého těla, zpevnění, kondici a pořádnou dávku energie. Pro začátečníky i pokročilé.
styly.sec3.eyebrow = Lehkost <span class="styly-bar">|</span> Vědomý pohyb <span class="styly-bar">|</span> Vnitřní síla
styly.sec3.title = Ženská péče a harmonie
styly.sec3.lead = Lekce tvořené s respektem k ženskému tělu, jeho potřebám a jednotlivým životním obdobím. Pro začátečníky i pokročilé.
styly.sec4.eyebrow = Nové zážitky <span class="styly-bar">|</span> Unikátní a speciální pomůcky
styly.sec4.title = Netradiční lekce a pohyb jinak
styly.sec4.lead = Lekce, které vystupují z běžného rozvrhu. Čekají tě netradiční formáty, nové pomůcky, jiná atmosféra i pohyb z trochu jiné perspektivy. Vyzkoušej si pohyb jako skutečný zážitek. Pro začátečníky i pokročilé.
