gdpr.hero.lead = Pokud jste naším klientem, svěřujete nám své osobní údaje. My, jako poskytovatelé služeb, zodpovídáme za jejich ochranu a zabezpečení. Seznamte se, prosím, s ochranou osobních údajů, zásadami a právy, které máte v souvislosti s GDPR (Nařízení o ochraně osobních údajů).
