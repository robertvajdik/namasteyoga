styly.restorative.title = Restorative Yoga <span>|</span> for the back and the whole body
styly.restorative.tag = This practice improves spinal flexibility, eases back pain and supports overall physical balance.
styly.restorative.p1 = Slow down. Release your back. Give your body space to regenerate.
styly.restorative.p2 = Restorative Yoga is a gentle, calm practice focused on releasing tension in the back, neck and the whole body. It helps you slow down, calm the breath and give your body quality rest. In class we use yoga props that support the body and let you stay comfortably in each pose for a longer time. No performance, no rush, no need to push past your limits.
styly.restorative.p3 = We give particular attention to the spine, back, shoulders and neck. Through gentle movement, mindful breathing and release, we create space for a pleasant sense of lightness and rest.
styly.restorative.whom = Who is the class for?
styly.restorative.whom.p1 = For anyone who spends a lot of time sitting, feels tension in the back or neck, carries uneven loads, or simply wants to give their body more care and regeneration. The class is suitable for beginners as well as experienced practitioners.
styly.restorative.whom.p2 = You don't need to be flexible. You don't need to know anything. Just come and give yourself some time. 🤍 Stop. Breathe in. Release your back. Let your body rest.

styly.yinsoul.title = Yin &amp; Soul Yoga <span>|</span> gentle practice
styly.yinsoul.tag = A gentle yoga embrace for the body. Peace for the mind. Time for the soul. For all ages.
styly.yinsoul.p1 = Yin &amp; Soul Yoga is a slow, mindful practice that invites you to settle down, release more deeply and come back to yourself. We stay in each pose for a longer time and, with the help of the breath, let the body gradually soften. We don't try to overcome anything or achieve perfect form. On the contrary – we learn to slow down, listen to the body and accept it just as it is.
styly.yinsoul.p2 = The Yin part of the class brings space for deeper stretching and release of tension in the body. The Soul part connects the practice with inner experience, conscious breathing and quieting of the mind. It's a time when you can set your duties aside for a moment, switch off your head and turn your attention inward. 🌙
styly.yinsoul.whom = Who is Yin &amp; Soul Yoga for?
styly.yinsoul.whom.p1 = For anyone looking for a balance between an active life and the need to slow down. It's suitable for beginners and experienced practitioners and beautifully complements more dynamic forms of yoga and other activities. You don't need to be flexible. You don't need to prove anything. Just come, take a breath and allow yourself to simply be for a while. Give your body gentleness, your mind calm and your soul space.
styly.yinsoul.whom.p2 = YIN – this style of yoga explores our inner space and allows us to get to know ourselves and our body deeply. It connects the body and mind together with the breath and gentle movement. Yin Yoga blends three ancient traditions: Indian (philosophy and asanas), Chinese Taoist and Traditional Chinese Medicine (the theory of meridians and Qi energy). Drawing on the deep wisdom of these traditions, Yin Yoga offers its gentleness, non-violence and inner strength. Above all we aim to release tension not only in the muscles but also in the joint connections, particularly in the lower body (the yin part of the body). Movement is performed mindfully and respectfully within our own range. It's a yoga suitable for everyone, regardless of experience or age. It brings the yin principle into our life, giving the body and mind a calmer approach and a deeper sense of self. With this yoga we gently caress not only the body but the soul as well.

styly.zaklady.title = Foundations of Yoga and Breath
styly.zaklady.tag = Start from the basics. Learn to feel your body, breath and movement.
styly.zaklady.p1 = 🌿 This class is a gentle, understandable introduction to the world of yoga. It's for everyone who is just starting out, wants to firm up the basics or wishes to better understand what actually happens in a yoga practice.
styly.zaklady.p2 = Together we'll learn the basic yoga poses, the principles of correct alignment and how to work with the body and the breath. We'll focus on stability, mobility, posture and the safe set-up of each pose. We'll pay particular attention to the breath – how to connect it with movement, how to feel it and how to use it for better focus, release and calm. The class moves at an easy pace and offers plenty of time to understand each pose, try it out and find your own comfort in it.
styly.zaklady.learn = What will you take away from the class?
styly.zaklady.b1 = ✨ better orientation in the basic yoga poses
styly.zaklady.b2 = ✨ more mindful work with the breath
styly.zaklady.b3 = ✨ a better sense of your own body
styly.zaklady.b4 = ✨ the basics of correct and safe pose execution
styly.zaklady.b5 = ✨ more stability, mobility and coordination
styly.zaklady.b6 = ✨ tools you can also use in your home practice
styly.zaklady.p3 = You don't need to be flexible. You don't need to know anything. You don't need any previous experience with yoga. Just come with an open mind and a desire to get to know your body a little differently.
styly.zaklady.p4 = 🌱 Because when you understand the foundations, you can build your whole yoga journey on them.
styly.zaklady.p5 = Stop. Breathe in. Start from the beginning.

styly.power.title = Power Yoga <span>|</span> functional, healthy movement
styly.power.tag = Strength, energy and mindful movement in one.
styly.power.p1 = Power Yoga is a dynamic form of yoga that combines yoga poses, flowing movement, strengthening and breath work. During class you'll break a nice sweat, strengthen the whole body and still give yourself space to slow down, focus on yourself and switch off from everyday life for a while.
styly.power.p2 = The class focuses mainly on strength, stability, flexibility and an active core. Expect a brisker pace, smooth transitions between poses and exercises that engage the whole body. Of course, we always finish with a calming closing and relaxation.
styly.power.whom = Who is Power Yoga for?
styly.power.whom.p1 = For anyone who enjoys active movement and wants to not just stretch the body but also strengthen it. You don't need to be experienced – what matters is coming with a willingness to try something new and respect your body's possibilities.

styly.core.title = Core <span>|</span> exercise and yoga for a strong core
styly.core.tag = Core, i.e. the deep stabilising system.
styly.core.p1 = In our classes we learn how to engage the core correctly and, above all, explain what the core actually is and what strengthening it brings. It is a deep layer of muscles that we engage carefully, step by step, part by part, and then connect into one unit. We want you to learn how to manage your muscles (core) and body perfectly and to have full control over them in any exercise. We use the most suitable and carefully selected exercises, not only from yoga, for proper strengthening. The classes are suitable for everyone who may suffer from different kinds of back pain, scoliosis and other spinal issues, weak abdominal muscles, diastasis (separation of the abdominal muscles) and more. Strengthening the core brings great benefits: relief from pain not just in the back, a more balanced body, better support for the organs, correct engagement of the diaphragm and many others.

styly.pilatesSoft.title = Sculpt Pilates Mat <span>|</span> soft &amp; gentle
styly.pilatesSoft.tag = A gentle path to a stronger, more stable body.
styly.pilatesSoft.p1 = Mat Pilates Soft &amp; Gentle is a calmer form of Pilates focused on mindful movement, correct posture, activation of the deep stabilising system and gentle strengthening of the whole body.
styly.pilatesSoft.p2 = The class moves at a pleasant pace and is ideal for those who want to start with Pilates, come back to regular movement or simply give themselves a kind yet effective practice. We'll work mainly with the breath, the core, spinal stability and controlled movement. The emphasis is on quality of execution, body awareness and correct muscle engagement, not on performance. Expect gentle strengthening, mobilisation, stretching and pleasant release. For times when you want to strengthen your body while still treating it with kindness and respect.
styly.pilatesSoft.p3 = Suitable for beginners and for anyone looking for a gentler form of Pilates.

styly.pilatesFull.title = Sculpt Pilates Mat <span>|</span> full body sculpt
styly.pilatesFull.tag = Strengthen. Sculpt. Feel every movement.
styly.pilatesFull.p1 = Full Body Sculpt is a more dynamic Mat Pilates class focused on effective strengthening and toning of the whole body. Expect a combination of Pilates principles, mindful core work and targeted strengthening sequences that gradually engage the abs, glutes, thighs, arms and back.
styly.pilatesFull.p2 = The class is built on controlled, precise movement, an active core and correct muscle engagement. Thanks to the flowing pace and repetition of movement patterns, the body gets a pleasant strengthening challenge without needing heavy weights.
styly.pilatesFull.p3 = Full Body Sculpt is ideal for anyone who wants to work on strength, stability, muscle tone and overall body toning.
styly.pilatesFull.p4 = 🔥 Expect an active class after which you'll really feel that your body has worked.
styly.pilatesFull.p5 = Suitable for beginners and more advanced students – the intensity of individual exercises can be adjusted to your own possibilities.

styly.vinyasa.title = Vinyasa Yoga
styly.vinyasa.tag = An intense, strength-focused class for strengthening the whole body – for more advanced students.
styly.vinyasa.p1 = It develops the flexibility, strength and shape of the whole body wonderfully, improves blood circulation and the cardiovascular system and speeds up the metabolism. Through breathing exercises combined with the poses, we deeply cleanse and detoxify the whole body. This style of yoga is suitable for more advanced students who are familiar with yoga poses, as well as for others who aren't afraid to try it. The class is built around the Sun Salutation, sequences flowing from it and the practice of easier and more demanding asanas (standing and seated), using the ujjayi breath that belongs to this yoga. At the end we settle into relaxation, where we release the whole body, muscular tension, and dive into our inner world, where we become the true and real "I", our true selves. The whole practice frees us from muscular tension, fatigue and stress, lifts our mood pleasantly and brings us to physical and mental harmony.

styly.panevni.title = Pelvic Floor <span>|</span> care and femininity
styly.panevni.tag = Mindful care for the female body. Strength, stability and a deeper connection with yourself.
styly.panevni.p1 = The pelvic floor is an important part of our deep stabilising system. Yet we often pay it very little attention.
styly.panevni.p2 = This class is an invitation to slow down, feel your body more clearly and learn to consciously engage the pelvic floor muscles in sync with the breath and the deep core. We'll work with gentle yet effective movements that support the correct engagement of the deep muscle layers, the stability of the pelvis and an active core. We'll focus on the ability not only to activate the pelvic floor but also to consciously release it – both are essential for it to work properly.
styly.panevni.p3 = We'll also pay attention to the connection of the pelvic floor with the diaphragm, the deep abdominal muscles and the muscles around the spine. It's their mutual cooperation that creates natural support for our body and helps us feel movement with more confidence and awareness.
styly.panevni.p4 = The class is taught sensitively and with respect for the individual possibilities of each body. It is not about maximum performance or about "clenching" muscles at any cost. We learn to recognise the right feeling, work with the breath and gradually build strength, stability and trust in our own body.
styly.panevni.whom = Who is the class for?
styly.panevni.whom.p1 = For women who want to get to know their body better, strengthen the deep core, pay attention to the pelvic floor and master its mindful engagement in everyday movement. The class can be a beautiful complement to caring for the female body in different stages of life. Each woman works according to her own abilities and current needs.
styly.panevni.whom.p2 = 🌿 Breathe. Feel. Activate. Release. Strengthen from the inside. Give your body the attention it deserves.
styly.panevni.proc = Why focus on the pelvic floor?
styly.panevni.proc.p = A properly functioning pelvic floor isn't just about strength. Equally important is its ability to activate consciously, work in sync with the breath and the deep core and then also release. Mindful work with the pelvic floor can help with issues such as:
styly.panevni.b1 = 🌿 leaking urine when coughing, laughing, running or exercising,
styly.panevni.b2 = 🌿 a feeling of weakness or lack of support in the pelvic area,
styly.panevni.b3 = 🌿 reduced awareness of the pelvic floor and difficulty engaging its muscles consciously,
styly.panevni.b4 = 🌿 some of the challenges that come with the postpartum period,
styly.panevni.b5 = 🌿 uncertainty when returning to movement and sport after pregnancy,
styly.panevni.b6 = 🌿 a feeling of instability in the pelvis and the core,
styly.panevni.b7 = 🌿 reduced coordination of the breath, the pelvic floor and the deep abdominal muscles.
styly.panevni.p5 = In some women, however, the issue isn't a weak pelvic floor but one that is too tight. That's why in class we don't only learn to "clench" but also to notice tension and consciously release the pelvic floor. Proper function requires balance between activation and relaxation. Regular, correctly performed activation can support better bladder control, core stability and overall awareness of the pelvic area. If your issues are significant, persistent or associated with pain, it is advisable to consult a pelvic floor physiotherapist. The point isn't to hold the pelvic floor tight all the time. It is to know how to feel it, engage it correctly, coordinate it with the breath and, at the right moment, also release it. 🤍

styly.tehotne.title = Prenatal Yoga
styly.tehotne.tag = Time for you, your body and your baby.
styly.tehotne.p1 = 🤍 Pregnancy is a unique time full of change. Prenatal Yoga offers a safe, mindful space where you can listen to your body, stay in pleasant movement and prepare for the various stages of pregnancy and for birth itself.
styly.tehotne.p2 = The class combines gentle movement, mindful breathing, release and strengthening of the body. We focus on mobility of the spine and pelvis, release of the back and neck area, healthy posture and natural work with the shifting centre of gravity during pregnancy. We also give attention to the pelvic floor – we learn not only to engage it consciously but above all to feel it and release it.
styly.tehotne.p3 = Breath work helps develop the ability to stay calm, feel your body and consciously respond to its needs. The class also includes relaxation techniques and quiet moments when you can turn your attention to yourself and your baby.
styly.tehotne.p4 = 🌿 Yoga as preparation for birth. Gentle work with the breath, the pelvic area, mobility and the ability to release tension can be a beautiful part of preparation for childbirth. We learn to feel the signals of our own body, work with the breath and find positions in which we feel safe and comfortable.
styly.tehotne.whom = Who is the class for?
styly.tehotne.whom.p1 = For mums-to-be who want to stay active, care for their body and create moments of calm in everyday life. The class respects the individual needs of pregnant women and the different stages of pregnancy. It isn't about performance or perfect pose execution. What matters is comfort, safety and a good feeling from movement.
styly.tehotne.whom.p2 = 🤍 Slow down. Breathe in. Feel your body. Stay in touch with your baby. Give yourself time that belongs just to the two of you.
styly.tehotne.note = Before starting any exercise during pregnancy we recommend consulting your doctor or midwife. In the case of any health complications, always follow their advice.

styly.diastaza.title = Diastasis <span>|</span> see the Core class
styly.diastaza.tag = Restoring the function of the abdominal muscles and a physio approach to resolving abdominal muscle separation.

styly.hormonalni.title = Hormonal Yoga <span>|</span> by Dinah Rodrigues
styly.hormonalni.tag = Yoga for balancing hormone levels, following Dinah Rodrigues.
styly.hormonalni.p1 = It is a complete sequence developed especially for women and oriented towards restoring hormonal balance. With regular practice you can address issues such as painful, heavy or missing menstruation, some causes of infertility, premenstrual syndrome and so on. Above all, however, this sequence was developed for middle-aged women as a method of preventing and addressing the challenges of menopause: hot flushes, psychological issues, osteoporosis and so on. In class we'll work with the body, the breath and the direction of energy, we'll encourage and strengthen the lower belly, and we'll talk about typically female issues from a health and emotional perspective. The sequence is for women of any age. Previous yoga experience is not required.

styly.intuitivni.title = Intuitive Yoga <span>|</span> women only
styly.intuitivni.tag = Inspiring, deeply felt classes for women.
styly.intuitivni.p1 = This is a women's group where you'll find release, understanding and support in a close circle of women. We'll learn to cultivate feminine energy and discover our own strength. In this way we'll better understand the needs of our body and turn our attention to ourselves. In class we'll use simple techniques that help us recover lost energy and the desire to create again. We'll release the body and the mind.
styly.intuitivni.obsah = Course content
styly.intuitivni.b1 = Gentle, stretching and releasing yoga
styly.intuitivni.b2 = Dynamic meditations to get life energy flowing
styly.intuitivni.b3 = Healing meditations focused on cleansing the chakras, healing relationships and more
styly.intuitivni.b4 = Calming meditation at the end
styly.intuitivni.b5 = Spontaneous dance and awakening of sexuality
styly.intuitivni.b6 = Art therapy and release of feelings through painting
styly.intuitivni.b7 = Intention rituals
styly.intuitivni.b8 = Tantra yoga for women / Mohendžodáro
styly.intuitivni.b9 = Introductions to relaxing massage of the hands and feet
styly.intuitivni.p2 = Every class will surprise you with something new. The content of the classes isn't fixed in advance.

styly.fly.title = Fly Yoga <span>|</span> yoga and exercise in aerial hammocks
styly.fly.tag = Fly, release and discover a whole new way of moving.
styly.fly.p1 = ✨ Fly Yoga is a unique combination of yoga, movement and an aerial hammock, which becomes both a support and a challenge. It lets you get into poses that are harder on the mat, work with your body more safely and experience a wonderful feeling of lightness and freedom.
styly.fly.p2 = During class we alternate strengthening, stretching, stabilising exercises, relaxation and elements in the air. The aerial hammock helps with deeper stretching, decompression of the spine and strengthening of the core. Fly Yoga supports strength, flexibility, balance, coordination and body awareness. It's also a great way to step out of the everyday routine for a while and enjoy movement a little differently. And then comes the moment when you simply let yourself swing in the hammock… 🌿 The body rests, the breath settles and your head finally switches off for a while.
styly.fly.whom = Who is Fly Yoga for?
styly.fly.whom.p1 = For anyone who wants to try something new, loves movement and wants to enjoy a mix of strength, stretching, playfulness and relaxation. You don't need to know yoga or have previous experience with aerial exercise. We adjust all poses and their intensity to each person's possibilities.
styly.fly.whom.p2 = ✨ Strengthen. Stretch. Release. And allow yourself to fly. Come and discover the feeling of your body lifting off the ground for a moment. 🤍

styly.wall.title = Wall Yoga <span>|</span> yoga with wall straps
styly.wall.tag = Yoga with special wall-mounted straps.
styly.wall.p1 = Yoga in special wall-mounted straps. The straps help us mainly with easier execution of a pose, with longer holds or, on the other hand, with intensifying it. The strap acts as support for the body or as a tool to strengthen it (the TRX principle). The straps make it easier to release a stiff spine and other joints and help us stretch much more deeply thanks to longer holds. Using the straps and stronger poses we strengthen the deep stabilising system, firming the whole body from the ground up. We perform every pose carefully and safely. We'll learn to see the world from a different perspective. There's no shortage of inversions either, which we reach easily with the help of the straps, so you can finally feel the deeply beneficial and healing effects of inverted poses. Classes also include breathing and relaxation techniques. The class has a refreshing effect on body, mind and soul, which become one. The class is focused on strengthening and releasing the whole body.
styly.wall.flow = <strong>FLOW &amp; WALL</strong> – a stretching class that flows at a pleasant pace. It has a beneficial effect on the circulation, hormone levels and the work of the heart, lungs and other organs. We release blockages and open up the flow of energy. See also Flow Yoga.
styly.wall.yin = <strong>YIN &amp; WALL</strong> is a very gentle, releasing and meditative class. The straps help us stay in a pose for a long time and enjoy its physical and inner benefits. This style of yoga explores our inner space in depth. It allows us to get to know ourselves. It brings a calmer approach and the yin principle into our life. See also Tibetan Yin Yoga.

styly.blacklight.title = Blacklight <span>|</span> yoga &amp; Pilates under UV light
styly.blacklight.tag = When a class turns into an experience.
styly.blacklight.p1 = ✨🖤 You come to the studio. The lights go out. The UV lights come on. And suddenly everything is different. Blacklight Yoga &amp; Pilates is an experiential class that connects mindful movement, music and the unique atmosphere of purple light. Under the UV light, colours, props and clothes come alive and an ordinary class takes on a whole new dimension. Expect a combination of yoga, Pilates, core strengthening, stretching and dynamic movement – but this time in an environment that draws you right in.
styly.blacklight.p2 = 🖤 No boredom.
styly.blacklight.p3 = ✨ No routine.
styly.blacklight.p4 = 🔥 Just movement, music, energy and experience.
styly.blacklight.p5 = The Blacklight class is great for anyone who wants to try something new, enjoy movement a little differently and switch off from the everyday world for a while. Whether you come with a friend, your partner or on your own, you'll have an evening that is about more than just exercising. You'll move. You'll laugh. You might even sweat properly. And above all – you'll want to come again.
styly.blacklight.p6 = 🌌 Dive into the dark. Light up your body. Experience yoga and Pilates in a completely new way.
styly.blacklight.p7 = The brightest class you've ever had. ✨

styly.parova.title = Partner Yoga <span>|</span> yoga for two
styly.parova.tag = Yoga in pairs.
styly.parova.p1 = Acrobatic and non-acrobatic yoga in pairs. The important thing is to have a partner or friend you can rely on both on the ground and in the air. It's about connecting yoga poses in a pair, where yoga takes on a whole new dimension. Suddenly we realise that it's no longer only about ourselves – it's about us together, learning to trust each other. It doesn't always work on the first try without help, but step by step we'll learn the correct technique, the grips, good posture both on top and underneath, poses and the transitions between them. We'll enjoy the mutual balance between us. Come and try amazing yoga in twos, threes or more. We'll teach you to trust. 😉

styly.cakra.title = Chakra Yoga <span>|</span> harmonising energy
styly.cakra.tag = Yoga that harmonises the flow of energy in the body and the chakras.
styly.cakra.p1 = Chakra Yoga focuses on the asanas and their effect on individual chakras. There are 7 main chakras in our body, all connected to each other, and each needs its own specific pose and approach. The chakras are energy vortices that can be harmonised through yoga, relaxation and meditation. In each class we'll get to know one chakra and learn the poses that influence and harmonise it most. We'll explain what chakras are, where they are located, what colours they have, their effects, which emotions they bring and how we can influence and heal them through yoga asanas and relaxation. We'll go through each pose in detail and its effect on the individual chakras. Chakra Yoga teaches us how to harmonise ourselves. Previous yoga experience is not required.

styly.deti.title = Yoga and exercise for children
styly.deti.tag = A fun, educational yoga class on the ground and in aerial hammocks.
styly.deti.p1 = Yoga that children enjoy, that supports their development and lets them explore the world of movement.
styly.deti.p2 = 🌈 Children's Yoga is above all playful, cheerful and full of imagination. Through movement, children learn to feel their body, work with the breath, focus and gradually discover everything their body can do. In our classes we use plenty of different props – aerial hammocks, wall straps, balls, hoops, blocks, balance tools and more. Thanks to these, children can explore different movement situations, try new poses, balance, strengthen and stretch. Props naturally help children develop balance, coordination, stability, strength, flexibility and spatial awareness. At the same time they support their natural curiosity and desire to try new things.
styly.deti.p3 = But it isn't only about the exercise itself. Children's Yoga creates a space where kids learn to listen to their body, work with the breath, calm down and respect themselves and others. Each class can be a little adventure – one day we go to the jungle, another day we fly in the hammock, look for balance or discover new yoga poses.
styly.deti.proc = 🐒🌿🦋 Why Children's Yoga?
styly.deti.b1 = ✨ supports healthy motor development
styly.deti.b2 = ✨ develops coordination and balance
styly.deti.b3 = ✨ strengthens the body and the deep stabilising system
styly.deti.b4 = ✨ supports flexibility and good posture
styly.deti.b5 = ✨ teaches children to feel their body and breath
styly.deti.b6 = ✨ develops focus and the ability to settle down
styly.deti.b7 = ✨ supports self-confidence, independence and the joy of movement
styly.deti.p4 = With us children don't exercise to be the best. They exercise so they can discover the joy of movement, get to know their body and enjoy time together. 🤍 🌈 Movement, imagination, laughter and yoga – exactly the way children like it.

styly.autogenni.title = Relaxation and Autogenic Training
styly.autogenni.tag = Relaxation technique by Johannes Heinrich Schultze.
styly.autogenni.p1 = This is a relaxation and psychotherapeutic method that uses suggestion to gradually release physical and mental tension and lets us better control some involuntary functions as well. At a more advanced level it can move from relaxation towards meditation.
styly.autogenni.p2 = We also use Autogenic Training with people who suffer from certain difficulties, such as neuroses, addictions, psychosomatic disorders and many others.
styly.autogenni.p3 = It is a technique that is very valuable in today's world and very beneficial for the body. We can do it anywhere, and it costs us nothing but quality time spent with ourselves.

styly.meditace.title = Meditation
styly.meditace.tag = For mental, emotional and physical release.
styly.meditace.p1 = The classes are for anyone who wants to work on their own development, as well as for people who feel weakened, exhausted or are searching. In such deep relaxation as meditation we refresh the whole body, re-energise the energy centres and recharge our emotional and mental strength. In meditation we can experience a deep knowing of ourselves, search for and find paths, and learn a positive approach to ourselves and others. It is up to us whether we will be healthy, happy, successful and content. We are the creators of our own life.

styly.mindfulness.title = Mindfulness
styly.mindfulness.tag = A path to inner wellbeing.
styly.mindfulness.p1 = Mindfulness helps us find calm in a hurried world. It is an important concept in Western psychology and psychotherapy, drawing on Buddhism. Research has repeatedly shown the positive effects of mindfulness: developing awareness helps reduce feelings of anxiety, depression, excessive fatigue and insomnia and has a positive effect on managing stress and on mental and physical health. Meditation and relaxation to settle the body. In this eight-hour course we'll learn several ways to bring mindfulness into our life. In a small group we'll have the chance to share our experiences with each other.

styly.taichi.title = Tai Chi
styly.taichi.tag = Tai Chi Chuan – the art of cultivating chi.
styly.taichi.quote1 = „You move slowly beneath the crowns of the trees, you breathe, and it feels as if, together with the lightest breeze, you merge with nature in its healing rhythm. Every part of the body moves together, smoothly, fluently and in a relaxed way. Tai Chi is hard to describe in words. It's like trying to express music through words."
styly.taichi.quote1.cite = — Paul Crompton, book Tai či
styly.taichi.p1 = Tai Chi (properly Tai Chi Chuan) is described as the art of cultivating chi. The ancient Chinese, like our own ancestors, believed that life is like a lit candle and that each of us should protect it so that it burns for as long as possible and its flame stays steady. The size of the flame corresponds to the amount of chi we are able to keep. The Tai Chi form is a slow, flowing, graceful choreography of 108 linked positions during which chi flows freely through the body along the pathways the ancient Chinese called meridians. Even though Tai Chi is a martial art, its performance speaks to those who are looking for calm and harmony.
styly.taichi.quote2 = Let the body have its daily movement.
styly.taichi.quote2.cite = — Jan Amos Komenský
