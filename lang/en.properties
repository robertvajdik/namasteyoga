# --- Terms of use page (podminky) ------------------------------------
podminky.title = Terms of Use
podminky.meta.description = Studio rules and terms of use for Namasté Yoga Studio in Uherský Brod.
podminky.hero.eyebrow = Namasté yoga studio · Uherský Brod
podminky.hero.title = Studio Namasté terms of use
podminky.hero.lead = Please familiarise yourself with our studio rules. By purchasing a course, a drop-in class or a pass you confirm that you respect them and will abide by them.
podminky.item.1 = Every client is obliged to familiarise themselves with the studio rules of Namasté yoga studio Uherský Brod. By purchasing a course, drop-in class or points pass, the client confirms they have read the rules and undertakes to fully respect and observe them.
podminky.item.2 = On entry, every client must present a valid pass or purchase a drop-in class. The current <a href="cenik.php">price list</a> is available on the website. Properly paid admission entitles the client to enter the studio premises and use its facilities and services.
podminky.item.3 = Namasté yoga studio Uherský Brod is open in the afternoons according to the current <a href="lekce.php">class schedule</a> published at www.namasteyoga.cz. Yoga classes are led by qualified instructors. Should any event occur that prevents the services from being provided, the Operator is entitled to cancel scheduled classes and announce this on the website or social networks.
podminky.item.4 = You can book a spot in a yoga class through the <a href="rezervace.php">reservation system</a> on the Namasté yoga studio Uherský Brod website. Personal data are processed under Act No. 101/2000 Coll., on the protection of personal data, as amended with effect from 1 January 2011. For more information on data processing, see the <a href="gdpr.php">Privacy Policy</a> section.
podminky.item.5 = A booked afternoon class can be cancelled by 2 p.m. at the latest on the day the class begins. A morning class can be cancelled no later than 10 p.m. the previous day. Course participants who cancel in time may claim make-ups for 1–2 missed classes. If a client does not arrive on time or fails to cancel via the online booking system or by phone in time, the class is forfeited and must be paid for at the Namasté yoga studio reception in Uherský Brod.
podminky.item.6 = Upon entering the studio, each client must place their outdoor shoes in the designated area located near the reception.
podminky.item.7 = The Operator bears no responsibility for valuables stored in the changing room (personal documents, keys, valuables, jewellery, money, payment cards, laptops and the like). Valuables may be taken along into the class hall. Should any personal belongings be stolen or lost, the client must immediately inform the reception staff or the instructor and contact the Czech Police. Later reports of theft or loss will not be taken into consideration.
podminky.item.8 = Every client is required to follow the staff's instructions. Entry to the studio is permitted only in clean footwear and appropriate sportswear. While performing the given sporting activity the client must not endanger their own health or the health of other clients. It is also forbidden to soil the premises in any way.
podminky.item.9 = Clients use all of the Operator's facilities and equipment at their own risk. Clients may also turn to the studio staff or an instructor if they need answers to questions about the equipment.
podminky.item.10 = Each client is fully responsible for their own state of health. Namasté yoga studio Uherský Brod bears no responsibility for the clients' state of health. Each client must also follow the instructor's directions regarding the exercise and equipment. Otherwise the Operator bears no responsibility for injuries incurred. Any injury must be reported immediately to the reception staff or any instructor present. While performing sporting activities the client must not endanger their own health or the health of other participants.
podminky.item.11 = After the class ends, every client must tidy away any props they have borrowed.
podminky.item.12 = Clients are required to follow the relevant fire-safety regulations, treat the Operator's property responsibly and keep the studio premises tidy.
podminky.item.13 = Clients are liable in full for damage caused by breaching the studio rules and for loss of or damage to the Operator's property, even if the damage was caused unintentionally.
podminky.hint = Namasté yoga studio Uherský Brod

# --- GDPR page (gdpr) ------------------------------------
gdpr.title = Privacy Policy
gdpr.meta.description = Personal data processing and privacy policy at Namasté Yoga Studio in accordance with the GDPR.
gdpr.hero.eyebrow = Studio Namasté
gdpr.hero.title = Personal data processing and privacy policy
gdpr.hero.lead = If you are our client, you entrust us with your personal data. As service providers, we are responsible for their protection and security. Please familiarise yourself with how we protect your personal data and with your rights under the GDPR (General Data Protection Regulation).
gdpr.controller.title = Who is the controller / service provider?
gdpr.controller.body = Mgr. Klára Bigasová<br>Namasté yoga studio, Masarykovo náměstí 69, 688 01 Uherský Brod<br>Company ID: 04614542
gdpr.contact.title = Contact details
gdpr.contact.intro = If you wish to contact us at any time during the processing of your data, you can reach us on
gdpr.contact.or.email = or by email:
gdpr.declaration.intro = We declare that as the controller of your personal data we meet the legal obligations required by current legislation, in particular the Personal Data Protection Act and the GDPR, which means that:
gdpr.declaration.item.1 = we will process your personal data only on a valid legal basis, in particular legitimate interest, performance of a contract, legal obligation or granted consent,
gdpr.declaration.item.2 = we fulfil the information obligation under Article 13 of the GDPR before starting to process personal data,
gdpr.declaration.item.3 = we will enable and support you in exercising and fulfilling your rights under the Personal Data Protection Act and the GDPR.
gdpr.scope.title = Scope of personal data and purposes of processing
gdpr.scope.intro = We process the personal data you entrust to us yourself, for the following reasons (to fulfil these purposes):
gdpr.scope.item.1 = <strong>Provision of services and performance of a contract.</strong> We need your personal data – first name and surname, address, date of birth, email and telephone – to perform the contract (e.g. a service contract).
gdpr.scope.item.2 = <strong>Bookkeeping.</strong> We need your personal data (billing details) in order to comply with our legal obligation to issue and record tax documents.
gdpr.scope.item.3 = <strong>Staying informed – newsletters.</strong> We use your personal data (email), what you click on in the emails and when you tend to open them, in order to send you information about events and courses at Studio Namasté. We only send newsletters on the basis of your consent, for a period of 10 years from the moment it is granted. You can withdraw this consent at any time by using the unsubscribe link in every email we send.
gdpr.scope.item.4 = <strong>Photos and video recordings from events.</strong> At some of our events we take photos or video. We use event photos in promotional materials, mainly on the website and social networks. Participant names never appear in this material, unless it is a reference and consent has been given. If you don't want to appear in the recordings, please let us know.
gdpr.scope.item.5 = <strong>Photos and video for promotional materials.</strong> We handle such material only on the basis of your consent.
gdpr.scope.retention = We keep your personal data for the duration of the limitation periods, unless the law prescribes a longer retention period or we have stated otherwise in specific cases.
gdpr.security.title = Security and protection of personal data
gdpr.security.body = We protect personal data to the maximum extent possible using modern technologies that correspond to the current state of the art. We have adopted technical and organisational measures to prevent misuse, damage or destruction of your personal data.
gdpr.third.title = Sharing personal data with third parties
gdpr.third.body = Your personal data are accessed by us (the providers) and our collaborators, who are bound by confidentiality and trained in the security of personal data processing. To handle certain specific processing operations that we cannot perform ourselves, we use services and applications of processors that specialise in the given processing and comply with the GDPR.
gdpr.third.list.intro = These are the providers of the following platforms and services:
gdpr.third.promise = We may decide in the future to use further applications or processors to make processing easier and better. However, we promise that when choosing them we will place at least the same security and processing quality requirements on the processor as on ourselves.
gdpr.eu.title = Transferring data outside the European Union
gdpr.eu.body = We process data exclusively within the European Union or in countries that ensure an adequate level of protection based on a European Commission decision.
gdpr.rights.title = Your rights regarding personal data protection
gdpr.rights.intro = You have a number of rights in connection with the protection of personal data. If you wish to exercise any of these rights, please contact us by email:
gdpr.rights.item.1 = <strong>Right to information</strong>, which is already fulfilled by this information page with the personal data processing policy.
gdpr.rights.item.2 = <strong>Right of access.</strong> You may ask us at any time and, within 30 days, we will document which of your personal data we process and why.
gdpr.rights.item.3 = <strong>Right to update and rectify personal data.</strong> If something in your details changes or you find your personal data outdated or incomplete.
gdpr.rights.item.4 = <strong>Right to restrict processing</strong> may be used if you believe we are processing inaccurate data about you, that our processing is unlawful but you do not wish to delete all the data, or if you have objected to the processing. You can restrict the scope of the personal data or the purposes of processing (e.g. by unsubscribing from the newsletter you restrict the processing purpose for commercial communications).
gdpr.rights.item.5 = <strong>Right to erasure (to be forgotten).</strong> In such a case we will erase all your personal data from our system. We need 30 days to secure the right to erasure. In some cases we are bound by a legal obligation, for example we must keep issued tax documents for a period set by law. In that case we will delete all personal data that are not bound by another law. We will inform you by email once the erasure is complete.
gdpr.rights.item.6 = <strong>Complaint to the Office for Personal Data Protection.</strong> If you feel we are not handling your data in accordance with the law, you have the right to lodge a complaint with the Office for Personal Data Protection at any time. We would be very grateful if you would first let us know about such suspicion, so that we can do something about it and correct any wrongdoing.
gdpr.rights.item.7 = <strong>Unsubscribing from newsletters and commercial communications.</strong> If you are our client or supporter, we send you emails with inspiration, articles or products and services on the basis of our legitimate interest. If you are not, we send them only on the basis of your consent. In both cases you can unsubscribe from our emails by pressing the unsubscribe link in every email we send.
gdpr.confidentiality.title = Confidentiality
gdpr.confidentiality.body = We assure you that our collaborators who will process your personal data are obliged to maintain confidentiality about the personal data and about the security measures whose disclosure would jeopardise the security of your personal data. This confidentiality continues even after our contractual relationships with us end. Without your consent your personal data will not be released to any other third party.
gdpr.effective = This personal data processing policy is effective as of 25&nbsp;May&nbsp;2018.

