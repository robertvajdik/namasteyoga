puppy.about.eyebrow = What's it about?
puppy.about.title = Exercise that soothes both body and soul
puppy.about.p1 = Puppy &amp; puppy vibe are yoga and pilates classes that combine calm movement, breath and an endless dose of the adorable presence of four-legged companions. You practise in the pleasant atmosphere of the studio, between sets you stretch out with puppies, kittens or your own pets and leave with a smile from ear to ear.
puppy.about.p2 = No previous experience is required – we run classes for beginners and advanced alike and adapt them to the mood of the group and the animals. We treat them with care: breaks, water and cuddles are a natural part of every class.
puppy.features.eyebrow = Why you'll love these classes
puppy.features.title = Joy you'll feel from the very first minute
puppy.feature.1.title = Stress relief
puppy.feature.1.desc = Cuddling and the presence of animals demonstrably lower cortisol levels. You'll leave lighter and in a better mood.
puppy.feature.2.title = Movement without pressure
puppy.feature.2.desc = Forget about performance – classes are led with sensitivity, leaving room for laughter and pauses for petting.
puppy.feature.3.title = Meet like-minded people
puppy.feature.3.desc = A group gathers of people who love animals and a moment for themselves. Friendships happen on their own.
puppy.feature.4.title = An experience, not just a class
puppy.feature.4.desc = You'll take away photos, memories and the feeling that you did something just for yourself – body and soul.
puppy.classes.eyebrow = What animal classes do we offer?
puppy.classes.title = Choose your dose of happiness
puppy.class.1.title = Puppy classes
puppy.class.1.sub = Yoga and pilates with puppies
puppy.class.1.desc = A classic among animal classes. We practise together with puppies from a trusted breeder who ask for cuddles between asanas, scamper around the hall and create the cutest backdrop you'll ever see.
puppy.class.1.li.1 = Suitable for beginners and advanced alike
puppy.class.1.li.2 = Groups of up to 10 people
puppy.class.1.li.3 = Practice 60 – 75 minutes
puppy.class.2.title = Classes with your own pets
puppy.class.2.sub = Bring your canine companion
puppy.class.2.desc = Have a dog at home you love spending time with? Come and practise with them at the studio. We'll show you a sequence that involves your pet and together you'll enjoy calm, connecting movement.
puppy.class.2.li.1 = The dog must be used to strangers and other animals
puppy.class.2.li.2 = Groups of up to 8 human + dog pairs
puppy.class.2.li.3 = Prior consultation at sign-up
puppy.class.3.title = Classes with kittens
puppy.class.3.sub = A gentler version with little felines
puppy.class.3.desc = For cat lovers we offer classes at a calmer pace with small kittens. The hall turns into a playful haven – ideal for yin and gentle pilates as the little ones come over for a cuddle.
puppy.class.3.li.1 = Calm practice yoga / yin / pilates
puppy.class.3.li.2 = Groups of up to 8 people
puppy.class.3.li.3 = Practice 60 minutes
puppy.info.eyebrow = Class information
puppy.info.title = For breeders
puppy.info.p1 = We'd love to team up with puppy and kitten breeders from Uherský Brod and the wider area. The animals get our full attention – the hall is calm, clean and between classes we ensure they have space to rest, drink and be cuddled.
puppy.info.p2 = If you're a breeder and would like to send your puppies or kittens to a class, contact us via the form above or directly by email – we'll agree on tailor-made terms and dates.
puppy.info.cta.write = Get in touch
puppy.info.cta.contact = Studio contacts

